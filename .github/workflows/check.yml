name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run media:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix packages/kit-sdk ci
      - run: npm --prefix packages/kit-sdk run build
      - run: npm audit --omit=dev --audit-level=moderate
